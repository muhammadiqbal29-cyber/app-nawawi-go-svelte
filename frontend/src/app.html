<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" crossorigin="use-credentials" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=0" />
    <!-- PWA: Apple iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SIAKAD" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <!-- PWA Enhancements: Matikan paksa context menu level JavaScript -->
    <script>
      document.addEventListener('contextmenu', function(e) {
        // Izinkan context menu hanya pada input dan textarea (untuk fitur copy/paste)
        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
